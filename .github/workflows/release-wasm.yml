name: Release WASM

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build & Publish WASM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build WASM package
        run: >
          wasm-pack build
          tpt-rag-wasm
          --target bundler
          --release
          --out-dir pkg

      - name: Set package version
        working-directory: tpt-rag-wasm/pkg
        run: |
          npm version "${{ steps.version.outputs.tag }}" --no-git-tag-version
          # Rename the package if needed (wasm-pack defaults to crate name)
          jq '.name = "tpt-raglite-wasm"' package.json > tmp.json && mv tmp.json package.json

      - name: Publish to npm
        working-directory: tpt-rag-wasm/pkg
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
