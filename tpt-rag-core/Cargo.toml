[package]
name = "tpt-rag-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
readme = "README.md"
keywords = ["rag", "embeddings", "vector-search", "hnsw", "onnx"]
categories = ["database-implementations", "text-processing"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
pdf-extract = { version = "0.12", optional = true }
html5ever = "0.39"
markup5ever_rcdom = "0.39"
tendril = "0.4"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
rand = "0.8"
ordered-float = "4"
pulldown-cmark = "0.13.5"
unicode-normalization = "0.1.26"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
glob = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"
ureq = "2"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Random numbers in the browser come from the Web Crypto API.
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["native", "reranking"]
# Everything that needs a native platform: ONNX Runtime, SQLite, the filesystem database and PDF
# parsing. Turn it off with `default-features = false` to build the pure parts for WebAssembly.
native = ["dep:ort", "dep:rusqlite", "dep:pdf-extract", "dep:glob"]
reranking = ["native"]
# Compiles models/all-MiniLM-L6-v2.onnx and models/vocab.txt into the binary, so a database
# works without model files on disk. Needs the files to be present at build time.
embedded-model = ["native"]

[dev-dependencies]
tempfile = "3"
