[package]
name = "tpt-rag-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
pdf-extract = "0.12"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
tendril = "0.4"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
ordered-float = "4"
pulldown-cmark = "0.13.5"
unicode-normalization = "0.1.26"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
glob = "0.3"

[features]
default = ["reranking"]
reranking = []
# Compiles models/all-MiniLM-L6-v2.onnx and models/vocab.txt into the binary, so a database
# works without model files on disk. Needs the files to be present at build time.
embedded-model = []

[dev-dependencies]
tempfile = "3"
