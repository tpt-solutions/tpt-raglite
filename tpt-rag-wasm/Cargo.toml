[package]
name = "tpt-rag-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly / JS wrapper for tpt-raglite: chunking, vector and keyword search in the browser. The host computes the embeddings."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-rag-core = { path = "../tpt-rag-core", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
wasm-bindgen-test = "0.3"
