[workspace]
members = [
    "tpt-rag-core",
    "tpt-rag-ffi",
    "tpt-rag-py",
    "tpt-rag-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/TPTSolutions/tpt-raglite"
description = "The SQLite for AI — Blazing-fast, embeddable, zero-configuration RAG engine"

[workspace.dependencies]
tpt-rag-core = { path = "tpt-rag-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
